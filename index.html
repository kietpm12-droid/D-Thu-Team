<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Nhập Dự Thu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>📋 NHẬP DỰ THU</h1>
      <p class="sub">Nhập thông tin dự thu khách hàng</p>

      <form id="duThuForm">

        <label>User *</label>
        <input id="user_name" type="text" placeholder="Nhập User" required>

        <label>Số CIF *</label>
        <input id="cif" type="text" placeholder="Nhập số CIF" required>

        <label>Tên Khách hàng *</label>
        <input id="customer_name" type="text"
               placeholder="Nhập tên khách hàng" required>

        <label>Số tiền dự thu *</label>
        <input id="amount" type="number"
               min="0" step="1000"
               placeholder="Ví dụ: 5000000" required>

        <label>Ngày thanh toán *</label>
        <input id="payment_date" type="date" required>

        <label>SĐT</label>
        <input id="phone" type="tel"
               placeholder="Nhập số điện thoại">

        <label>Ghi chú</label>
        <textarea id="note" rows="4"
                  placeholder="Nhập ghi chú"></textarea>

        <button id="submitBtn" type="submit">
          GỬI DỰ THU
        </button>

        <div id="message"></div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
