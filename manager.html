<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Dự Thu</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* =====================================================
       1. CẤU TRÚC VÀ CHUNG (RESET)
    ===================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      padding: 16px 12px;
    }

    .manager-card {
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      border: 1px solid #f1f5f9;
    }

    /* HEADER & TITLE */
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 16px;
    }

    /* =====================================================
       2. NÚT ĐĂNG XUẤT (NẰM TRÊN CÙNG)
    ===================================================== */
    .logout-btn {
      background: #5c6b73 !important;
      color: white !important;
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .logout-btn:hover {
      background: #4a5568 !important;
    }

    /* =====================================================
       3. KHUNG THỐNG KÊ (2 KHỐI NẰM CẠNH NHAU)
    ===================================================== */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-title {
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
    }

    /* =====================================================
       4. KHUNG BỘ LỌC (CÓ VIỀN BO TRÒN NHƯ HÌNH MẪU)
    ===================================================== */
    .filters-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Ô NHẬP LỌC - MẶC ĐỊNH MÁY TÍNH LÀ 2 CỘT */
    .filter-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    .form-group input {
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    .form-group input:focus {
      border-color: #6366f1;
    }

    /* NHÓM NÚT BẤM (LỌC, LÀM MỚI, XUẤT EXCEL) - MÁY TÍNH LÀ 3 CỘT */
    .btn-group-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn-action {
      height: 44px;
      border-radius: 8px;
      border: 0;
      color: white;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 10px;
    }

    .btn-filter { background: #5555ff; }
    .btn-filter:hover { background: #4444ee; }

    .btn-refresh { background: #00b0ff; }
    .btn-refresh:hover { background: #0099e0; }

    .btn-export { background: #10b981; }
    .btn-export:hover { background: #059669; }

    .btn-delete-all {
      background: #ef4444;
      color: white;
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-delete-all:hover { background: #dc2626; }

    /* =====================================================
       5. BẢNG DỮ LIỆU
    ===================================================== */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      -webkit-overflow-scrolling: touch; /* Giúp cuộn mượt trên iPhone/iOS */
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px; /* Đảm bảo bảng không bị ép nhỏ trên điện thoại */
    }

    th, td {
      padding: 12px;
      font-size: 13px;
      border-bottom: 1px solid #f1f5f9;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
      color: #334155;
    }

    .empty-row {
      text-align: center;
      color: #94a3b8;
      padding: 24px;
      font-style: italic;
    }

    /* PHÂN TRANG & THÔNG BÁO */
    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .page-info {
      font-size: 13px;
      font-weight: 700;
      color: #475569;
    }

    .page-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }

    /* =====================================================
       6. ĐẶC BIỆT: TỐI ƯU DÀNH RIÊNG CHO ĐIỆN THOẠI (CSS MOBILE)
    ===================================================== */
    @media (max-width: 640px) {
      body {
        padding: 8px; /* Thu nhỏ lề viền màn hình điện thoại */
      }

      .card {
        padding: 14px; /* Giảm padding thẻ card */
      }

      /* Ô nhập liệu xếp thành 1 cột */
      .filter-inputs {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      /* 3 Nút (Lọc, Làm mới, Xuất Excel) tự xếp dốc để không bị dính chữ */
      .btn-group-3 {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      /* Tăng kích thước nút bấm một chút để ngón tay dễ bấm */
      .btn-action, .btn-delete-all, .logout-btn {
        height: 46px;
        font-size: 14px;
      }

      .stat-value {
        font-size: 18px; /* Thu nhỏ chữ số tiền một chút để không vỡ dòng */
      }
    }
  </style>
</head>

<body>

  <main class="manager-card">
    <section class="card">

      <!-- TIÊU ĐỀ -->
      <div class="header-title">
        <span>📊</span> QUẢN LÝ DỰ THU
      </div>

      <!-- ĐĂNG NHẬP (ẨN KHI ĐÃ ĐĂNG NHẬP) -->
      <div id="loginBox" style="display:none;">
        <!-- Code đăng nhập nếu có -->
      </div>

      <!-- TRANG QUẢN LÝ -->
      <div id="managerBox">

        <!-- NÚT ĐĂNG XUẤT -->
        <button id="logoutBtn" type="button" class="logout-btn">
          🚪 ĐĂNG XUẤT
        </button>

        <!-- THỐNG KÊ (2 KHỐI) -->
        <div class="stats">
          <div class="stat">
            <div class="stat-title">Tổng khách hàng</div>
            <div class="stat-value" id="totalCustomers">0</div>
          </div>

          <div class="stat">
            <div class="stat-title">Tổng dự thu</div>
            <div class="stat-value" id="totalAmount">0 đ</div>
          </div>
        </div>

        <!-- BỘ LỌC DỮ LIỆU -->
        <div class="filters-box">
          <!-- 2 HÀNG NHẬP LỌC -->
          <div class="filter-inputs">
            <div class="form-group">
              <label for="filterUser">Lọc theo User</label>
              <input id="filterUser" type="text" placeholder="Nhập User">
            </div>

            <div class="form-group">
              <label for="filterDate">Lọc theo ngày thanh toán</label>
              <input id="filterDate" type="date">
            </div>
          </div>

          <!-- 3 NÚT CHỨC NĂNG -->
          <div class="btn-group-3">
            <button id="filterBtn" type="button" class="btn-action btn-filter">
              🔎 LỌC DỮ LIỆU
            </button>
            <button id="refreshBtn" type="button" class="btn-action btn-refresh">
              🔄 LÀM MỚI
            </button>
            <button id="exportBtn" type="button" class="btn-action btn-export">
              📥 XUẤT EXCEL
            </button>
          </div>

          <!-- NÚT XÓA TẤT CẢ -->
          <button id="deleteAllBtn" type="button" class="btn-delete-all">
            🗑️ XÓA TẤT CẢ
          </button>
        </div>

        <!-- BẢNG DỮ LIỆU -->
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Số CIF</th>
                <th>Tên Khách hàng</th>
                <th>Số tiền dự thu</th>
                <th>Ngày thanh toán</th>
                <th>SĐT</th>
                <th>Ghi chú</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="8" class="empty-row">Không có dữ liệu</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- PHÂN TRANG -->
        <div id="pagination">
          <button type="button" class="page-btn" id="prevPageBtn" disabled>❮</button>
          <span class="page-info" id="pageInfo">Trang 1 / 1</span>
          <button type="button" class="page-btn" id="nextPageBtn" disabled>❯</button>
        </div>

      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" defer></script>
  <script src="config.js" defer></script>
  <script src="manager.js?v=6" defer></script>

</body>

</html>
